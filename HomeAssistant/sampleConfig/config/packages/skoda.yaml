################################################################################ 
#  How to install.                                                             #
#                                                                              #
# 1. create a directory for config file (/config/packages)                     #
# 2. copy this file into the directory (you many change the name).             #
# 3. Add the following two lines into /config/configuration.yaml               #
# homeassistant:                                                               #
#   packages: !include_dir_named packages                                      #
#                                                                              #
################################################################################

# Buttons works better with an asynchronous data source.
template:
  - button:
      - name: "Start Skoda AC"
        unique_id: skoda_ac_start
        press:
          - action: rest_command.skoda_ac_on
  - button:
      - name: "Start Skoda Charging"
        unique_id: skoda_charge_start
        press:
          - action: rest_command.skoda_charge_on
  - button:
      - name: "Stop Skoda Charging"
        unique_id: skoda_charge_stop
        press:
          - action: rest_command.skoda_charge_off
# Commands          
rest_command:
  skoda_ac_start:
    url: "http://local-skodalnxcmd-service:8080/ac/on"
    method: POST
  skoda_ac_stop:
    url: "http://local-skodalnxcmd-service:8080/ac/off"
    method: POST
  skoda_charge_start:
    url: "http://local-skodalnxcmd-service:8080/charge/on"
    method: POST
  skoda_charge_stop:
    url: "http://local-skodalnxcmd-service:8080/charge/off"
    method: POST

# Sensors
rest:
  - resource: http://local-skodalnxcmd-service:8080/status
    scan_interval: 300
    binary_sensor:
      - name: "Skoda Charging"
        value_template: "{{ value_json.charging }}"

      - name: "Skoda Charge Cable Connected"
        value_template: "{{ value_json.charge_cable_connected }}"

      - name: "Skoda AirCon"
        value_template: "{{ value_json.ac }}"

      - name: "Skoda Locked"
        value_template: "{{ value_json.locked }}"
        icon: mdi:car-door-lock
    sensor:
      - name: "Skoda State of Charge"
        unique_id: skoda_soc
        value_template: "{{ value_json.soc }}"
        unit_of_measurement: "%"
        icon: mdi:car-electric

      - name: "Skoda Range"
        value_template: "{{ value_json.range }}"
        unit_of_measurement: "km"

      - name: "Skoda Odometer"
        value_template: "{{ value_json.odometer }}"
        unit_of_measurement: "km"
        icon: mdi:counter

      - name: "Skoda Parking Location"
        value_template: "{{ value_json.parking_location }}"
        icon: mdi:map-marker

      - name: "Skoda Charge Completion"
        value_template: "{{ value_json.charge_done }}"
        device_class: timestamp
        icon: mdi:clock-check-outline

      - name: "Skoda Charging Power"
        value_template: "{{ value_json.charge_power | float(0) }}"
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        icon: mdi:lightning-bolt

      - name: "Skoda Charging Rate"
        value_template: "{{ value_json.charge_rate | float(0) }}"
        unit_of_measurement: "km/h"
        state_class: measurement
        icon: mdi:speedometer

      - name: "Skoda AC State"
        value_template: "{{ value_json.ac_state }}"

      - name: "Skoda Locked Status"
        value_template: "{{ value_json.locked_status }}"

      - name: "Skoda Latitude"
        value_template: "{{ value_json.parking_coordinates.latitude }}"

      - name: "Skoda Longitude"
        value_template: "{{ value_json.parking_coordinates.longitude }}"
